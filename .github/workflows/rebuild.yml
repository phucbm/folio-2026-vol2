# Daily rebuild (plan 001, "Data"): fetches the numbers again and deploys, so Table 1 stays fresh
# between posts. Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy;
# GH_PAT (a token of the site's owner, so private contributions count), DISCORD_BOT_TOKEN and
# DISCORD_CHANNEL_ID for the data. Without the Cloudflare secrets it stops quietly; a source without
# its token keeps the last value committed in data/live.generated.json.
name: Rebuild

on:
  schedule:
    - cron: "0 0 * * *" # 07:00 in Ho Chi Minh City
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, skipping the rebuild."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
